<!DOCTYPE html>
<html><head><meta charset="UTF-8"/><title>og</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; }
  body {
    background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #3b82f6 100%);
    color: white;
    padding: 60px 80px;
    position: relative;
  }
  /* 裝飾圓圈 */
  .bg-circle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
  .c1 { width: 380px; height: 380px; right: -100px; top: -120px; background: rgba(251, 191, 36, 0.18); }
  .c2 { width: 260px; height: 260px; right: 100px; bottom: -80px; background: rgba(220, 38, 38, 0.25); }
  .c3 { width: 180px; height: 180px; right: 320px; top: 280px; background: rgba(245, 158, 11, 0.3); }
  .c4 { width: 120px; height: 120px; right: 540px; bottom: 110px; background: rgba(254, 243, 199, 0.4); }
  .c5 { width: 80px; height: 80px; right: 220px; top: 460px; background: rgba(220, 38, 38, 0.35); }

  .badge {
    display: inline-block;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(8px);
    padding: 8px 18px;
    border-radius: 24px;
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 30px;
    letter-spacing: 1px;
  }
  h1 {
    font-size: 84px;
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 24px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }
  .sub {
    font-size: 30px;
    opacity: 0.92;
    margin-bottom: 50px;
    max-width: 700px;
    line-height: 1.4;
  }
  .stats {
    display: flex;
    gap: 50px;
    margin-top: 40px;
  }
  .stat .num {
    font-size: 56px;
    font-weight: 700;
    color: #fbbf24;
    line-height: 1;
  }
  .stat .lbl {
    font-size: 18px;
    opacity: 0.9;
    margin-top: 8px;
  }
  .footer {
    position: absolute;
    bottom: 40px;
    left: 80px;
    font-size: 18px;
    opacity: 0.7;
  }
  .footer strong { color: #fbbf24; }
</style></head>
<body>
  <div class="bg-circle c1"></div>
  <div class="bg-circle c2"></div>
  <div class="bg-circle c3"></div>
  <div class="bg-circle c4"></div>
  <div class="bg-circle c5"></div>

  <div class="badge">🏠 內政部實價登錄 · 即時資料</div>
  <h1>台南房屋<br/>成交價查詢</h1>
  <div class="sub">日期 · 行政區 · 路段 · 預售屋/新屋/中古屋分類一站搞定</div>

  <div class="stats">
    <div class="stat"><div class="num">30,910</div><div class="lbl">筆成交紀錄</div></div>
    <div class="stat"><div class="num">37</div><div class="lbl">行政區覆蓋</div></div>
    <div class="stat"><div class="num">3</div><div class="lbl">類型分類</div></div>
  </div>

  <div class="footer">
    <strong>joshlin55688-debug.github.io/tainan-house-price</strong>
  </div>
</body></html>
